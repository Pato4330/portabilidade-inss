name: Auto Import Allox

on:
  schedule:
    - cron: '*/5 * * * *'  # a cada 5 minutos
  workflow_dispatch:         # botao pra rodar manual

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto-import
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "https://fvvrcpqiiygufyovmvwd.supabase.co/functions/v1/auto-import" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_SP3QjI8oQQL9fFvVFr1UXA_IsfbMtlg" \
            -H "Authorization: Bearer sb_publishable_SP3QjI8oQQL9fFvVFr1UXA_IsfbMtlg" \
            -d '{}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          # Log resumido
          NEW=$(echo "$BODY" | jq -r '.new_processed // 0')
          TOTAL=$(echo "$BODY" | jq -r '.total_cards // 0')
          echo "Cards no funil: $TOTAL | Novos processados: $NEW"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO na importação!"
            exit 1
          fi
